# Independent test set for the café ordering agent.
# Place at data/human_test/human_test_authoring.yaml.
#
# Authorship: cases with `author: claude` were written by Claude (an LLM), independently of the
# training templates and paraphrases. Add your own with `author: palak` (or a friend's name) and
# report the human-written slice separately in the README.
#
# Format
#   turns: user messages in order. Each has `expect`, the correct FIRST action for that turn:
#     {action: tool_call, tool: <name>, args: {...}}
#     {action: clarify, about: size | item | quantity | order_id}
#     {action: decline, reason: off_menu | unsupported_modifier | out_of_scope}
#   after_tool: inform_error   -> the tool returns an error; the reply must explain it
#                                 (and offer the returned alternatives when there are any).
#   "$LAST_ORDER_ID"           -> the order_id returned by the most recent successful create_order.
#   Unsized items omit `size`. `modifiers` order does not matter. Omit `customer_name` unless given.
#
# A converter script turns this file into the JSONL schema in PROJECT_SPEC.md Section 5 by replaying
# the expected calls against a fresh backend (that also yields expected tool results and final state).

