[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cafe-tool-agent"
version = "0.1.0"
description = "A reproducible café tool-calling agent and LoRA evaluation project."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anyio==4.9.0",
    "fastapi==0.115.12",
    "gradio==5.31.0",
    "groq==0.28.0",
    "httpx==0.28.1",
    "huggingface-hub==0.30.2",
    "Jinja2==3.1.6",
    "matplotlib==3.10.3",
    "pydantic==2.11.7",
    "python-dotenv==1.1.1",
    "PyYAML==6.0.2",
    "transformers==4.51.3",
    "uvicorn==0.34.3",
]

[project.optional-dependencies]
cpu = [
    "llama-cpp-python==0.3.9; sys_platform != 'linux'",
    "llama-cpp-python==0.3.21; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cafe_agent"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "cafe_agent/configs"

[tool.uv]
exclude-newer = "2026-09-30T00:00:00Z"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]
