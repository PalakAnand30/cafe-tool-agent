seed: 42
temperature: 0
max_tokens: 512
systems:
  S1: {model: Qwen/Qwen2.5-1.5B-Instruct, backend: vllm, enabled: false}
  S2: {model: Qwen/Qwen2.5-1.5B-Instruct, backend: vllm, enabled: false}
  S3: {model: openai/gpt-oss-120b, backend: groq, enabled: true}
  S4: {model: fine-tuned-merged, backend: vllm, enabled: false}
  S5: {model: fine-tuned-Q4_K_M, backend: llama.cpp, enabled: false}
datasets:
  independent_test:
    path: data/human_test/independent_test.jsonl
    author: claude
    conversations: 84
  test:
    path: data/generated-independent-v1/test.jsonl
