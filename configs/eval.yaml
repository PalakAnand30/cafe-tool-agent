    conversations: 400
output_dir: results/predictions
metrics_path: results/metrics.json
report_path: results/S3_baseline.md
modes: [turn, end_to_end]
bootstrap_samples: 1000
confidence: 0.95
progress_every: 10
max_quota_wait_seconds: 60
pricing:
  input_per_million_usd: '0.15'
  output_per_million_usd: '0.60'
  verified_date: '2026-10-14'
  source: https://console.groq.com/docs/model/openai/gpt-oss-120b
  assumption: Cold paid-equivalent estimate; input-cache discounts and free-plan billing excluded.
