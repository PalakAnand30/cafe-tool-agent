name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install locked dependencies
        run: make setup
      - name: Lint and format checks
        run: make lint
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: qwen-tokenizer-${{ runner.os }}-${{ hashFiles('configs/train.yaml') }}
      - name: Cache the pinned tokenizer (no weights)
        run: uv run --locked python -c "from cafe_agent.data.tokenization import load_tokenizer; load_tokenizer()"
      - name: Unit tests
        run: make test
